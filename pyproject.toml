[project]
name = "oanda-mcp"
version = "0.2.1"
description = "MCP server for the OANDA v20 REST API (read-only tools)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aoba Three", email = "research@aobathree.com" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
oanda-mcp = "oanda_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
