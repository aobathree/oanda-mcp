[project]
name = "oanda-mcp"
version = "0.3.0"
description = "MCP server for the OANDA v20 REST API (read-only tools)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aoba Three", email = "research@aobathree.com" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15,<0.16",  # bounded so a future default-rule change cannot break CI
    "mypy>=1.10",
]

[project.scripts]
oanda-mcp = "oanda_mcp.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
# test_integration.py is an opt-in standalone script (needs real practice
# credentials); run it directly with `python tests/test_integration.py`.
testpaths = ["tests/test_server.py"]
